name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    php-lint:
        name: PHPCS + PHPStan
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.3'
                  tools: composer
            - run: composer install --no-progress --prefer-dist
            - run: composer lint

    js-lint:
        name: ESLint + Stylelint + Prettier
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: npm
            - run: npm ci
            - run: npm run lint:js
            - run: npm run lint:css
            - run: npm run format:check

    unit:
        name: Unit (PHP ${{ matrix.php }})
        runs-on: ubuntu-latest
        strategy:
            matrix:
                php: ['7.4', '8.4']
            fail-fast: false
        steps:
            - uses: actions/checkout@v4
            - uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  tools: composer
            - run: composer install --no-progress --prefer-dist
            - run: composer test

    integration:
        name: Integration (PHP ${{ matrix.php }}, WP ${{ matrix.wp }})
        runs-on: ubuntu-latest
        strategy:
            matrix:
                php: ['7.4', '8.0', '8.2', '8.4']
                wp: ['latest', '6.5']
            fail-fast: false
        services:
            mysql:
                image: mysql:8.0
                env:
                    MYSQL_ROOT_PASSWORD: root
                    MYSQL_DATABASE: wordpress_tests
                ports:
                    - 3306:3306
                options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
        steps:
            - uses: actions/checkout@v4
            - uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  extensions: mysqli
                  tools: composer
            - run: composer install --no-progress --prefer-dist
            - name: Install SVN
              run: sudo apt-get update && sudo apt-get install -y subversion
            - name: Install WP test suite
              run: bash tests/bin/install-wp-tests.sh wordpress_tests root root 127.0.0.1 ${{ matrix.wp }}
            - run: composer test:integration
