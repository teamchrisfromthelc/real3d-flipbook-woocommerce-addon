name: Release

on:
    push:
        tags: ['v*']

permissions:
    contents: write

jobs:
    release:
        name: Create Release
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.3'
                  tools: composer

            # bin/build.sh reads the version from the plugin header. A tag that
            # disagrees would publish a release plugin-update-checker misreports.
            - name: Check tag matches Version header
              run: |
                  header=$(sed -nE 's/^[[:space:]]*\*?[[:space:]]*Version:[[:space:]]*([^[:space:]]+).*/\1/p' real3d-flipbook-woocommerce-addon.php | head -1)
                  if [ "v${header}" != "${GITHUB_REF_NAME}" ]; then
                    echo "::error::Tag ${GITHUB_REF_NAME} does not match Version: ${header}"
                    exit 1
                  fi

            - name: Package plugin
              run: composer build

            - uses: softprops/action-gh-release@v2
              with:
                  files: dist/*.zip
                  generate_release_notes: true
